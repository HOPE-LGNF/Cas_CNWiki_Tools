<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中文-id 查找器 · 双向查询</title>
<style>
    /* ===== CSS 变量 & 重置 ===== */
    :root {
        --primary: #4A6CF7;
        --primary-light: #6B8AFF;
        --primary-dark: #3458D6;
        --bg: #F0F4FF;
        --card-bg: #FFFFFF;
        --text: #1E293B;
        --text-secondary: #64748B;
        --border: #E2E8F0;
        --shadow: 0 12px 40px rgba(74, 108, 247, 0.12);
        --radius: 16px;
        --radius-sm: 10px;
        --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        --mono: 'JetBrains Mono', 'Fira Code', 'Consolas', 'SF Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow: hidden;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 16px;
    }

    .app {
        width: 100%;
        max-width: 1400px;
        height: 100%;
        max-height: 900px;
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* ===== 头部 ===== */
    .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
    }
    .header-left {
        flex: 1;
        min-width: 0;
    }
    .header h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }
    .header h1 span {
        font-size: 13px;
        font-weight: 500;
        color: var(--primary);
        background: var(--bg);
        padding: 2px 12px;
        border-radius: 20px;
    }
    .header p {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 4px;
        transition: var(--transition);
        overflow: hidden;
    }
    /* 折叠介绍：副标题收起 */
    .header.collapsed p {
        max-height: 0;
        margin-top: 0;
        opacity: 0;
    }
    .hide-desc-btn {
        flex-shrink: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
        font-family: var(--font);
    }
    .hide-desc-btn:hover {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
    }

    /* ===== 主布局 ===== */
    .main-layout {
        flex: 1;
        display: flex;
        gap: 18px;
        min-height: 0;
    }
    .left-panel {
        flex: 0 0 44%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
    }
    .right-panel {
        flex: 1;
        background: #F8FAFC;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    /* ===== 文件上传区 ===== */
    .input-section {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        flex-shrink: 0;
    }
    .input-section label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
    }
    .file-drop-zone {
        border: 2px dashed var(--border);
        border-radius: var(--radius-sm);
        padding: 14px;
        text-align: center;
        cursor: pointer;
        transition: var(--transition);
        background: var(--bg);
    }
    .file-drop-zone:hover {
        border-color: var(--primary-light);
        background: #E8EEFF;
    }
    .file-drop-zone.dragover {
        border-color: var(--primary);
        background: #E0E7FF;
        transform: scale(1.01);
    }
    .file-drop-zone.loaded {
        border-style: solid;
        border-color: #10B981;
        background: #ECFDF5;
    }
    .file-drop-zone .big-icon {
        font-size: 24px;
        display: block;
        margin-bottom: 4px;
    }
    .file-drop-zone .main-text {
        font-size: 13px;
        color: var(--text);
        font-weight: 500;
    }
    .file-drop-zone .sub {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 3px;
        font-family: var(--mono);
        word-break: break-all;
    }

    /* ===== 搜索区 ===== */
    .result-section {
        flex: 1;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
    }
    .search-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        flex-wrap: wrap;
    }
    .search-wrap {
        flex: 1;
        position: relative;
        min-width: 180px;
    }
    .search-wrap .icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 14px;
        opacity: 0.6;
        pointer-events: none;
    }
    .search-wrap input {
        width: 100%;
        padding: 8px 30px 8px 32px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        font-family: var(--font);
        outline: none;
        transition: var(--transition);
        background: #fff;
    }
    .search-wrap input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.12);
    }
    .clear-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 14px;
        padding: 2px 6px;
        border-radius: 6px;
        transition: var(--transition);
        line-height: 1;
    }
    .clear-btn:hover {
        background: var(--bg);
        color: var(--text);
    }
    .mode-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        flex-shrink: 0;
        white-space: nowrap;
    }
    .mode-badge.zh {
        background: #DBEAFE;
        color: #1D4ED8;
    }
    .mode-badge.id {
        background: #FCE7F3;
        color: #BE185D;
    }
    .mode-badge.idle {
        background: var(--bg);
        color: var(--text-secondary);
    }
    /* dsc 屏蔽开关 */
    .toggle-dsc {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-secondary);
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
        white-space: nowrap;
        padding: 3px 8px;
        border-radius: 8px;
        transition: var(--transition);
    }
    .toggle-dsc:hover { background: var(--bg); }
    .toggle-dsc input {
        margin: 0;
        cursor: pointer;
        accent-color: var(--primary);
    }
    .toggle-dsc .dsc-count {
        font-size: 10px;
        background: var(--bg);
        color: var(--text-secondary);
        padding: 1px 6px;
        border-radius: 10px;
        font-weight: 600;
    }
    .stats {
        font-size: 12px;
        color: var(--text-secondary);
        flex-shrink: 0;
        white-space: nowrap;
    }
    .stats strong {
        color: var(--primary);
        font-weight: 700;
    }

    /* ===== 列表 ===== */
    .list-container {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
    }
    .list-container::-webkit-scrollbar { width: 4px; }
    .list-container::-webkit-scrollbar-track { background: transparent; }
    .list-container::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    .list-container::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    .list-item {
        padding: 8px 12px;
        font-size: 13px;
        border-bottom: 1px solid var(--border);
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        word-break: break-all;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: #EEF2FF; }
    .list-item.active { background: #DBEAFE; }

    .list-item .idx {
        font-size: 10px;
        color: var(--text-secondary);
        background: var(--bg);
        padding: 0 6px;
        border-radius: 20px;
        font-weight: 500;
        font-family: var(--font);
        flex-shrink: 0;
        min-width: 22px;
        text-align: center;
        line-height: 1.6;
    }
    .list-item .section-tag {
        font-size: 10px;
        color: var(--primary-dark);
        background: #E0E7FF;
        padding: 1px 7px;
        border-radius: 20px;
        font-weight: 600;
        font-family: var(--mono);
        flex-shrink: 0;
    }
    .list-item .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }
    .list-item .content .primary {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        font-family: var(--mono);
    }
    .list-item .content .secondary {
        font-size: 12px;
        color: var(--text-secondary);
    }
    .list-item .content mark {
        background: #FDE047;
        padding: 0 2px;
        border-radius: 3px;
        font-weight: 600;
        color: var(--text);
    }
    .list-item .arrow {
        color: var(--text-secondary);
        font-size: 12px;
        flex-shrink: 0;
        opacity: 0.6;
    }
    .list-item .copy-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 13px;
        padding: 2px 4px;
        border-radius: 6px;
        transition: var(--transition);
        opacity: 0.25;
        flex-shrink: 0;
        line-height: 1;
    }
    .list-item:hover .copy-btn { opacity: 0.6; }
    .list-item .copy-btn:hover {
        opacity: 1 !important;
        background: var(--bg);
        color: var(--primary);
    }

    .empty-state {
        padding: 30px 16px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 13px;
    }
    .empty-state .big-icon {
        font-size: 32px;
        display: block;
        margin-bottom: 8px;
        opacity: 0.5;
    }

    /* ===== 右栏详情 ===== */
    .preview-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-secondary);
        font-size: 14px;
        padding: 20px;
        text-align: center;
        flex: 1;
    }
    .preview-placeholder .big-icon {
        font-size: 44px;
        margin-bottom: 10px;
        opacity: 0.4;
    }
    .preview-placeholder .sub {
        font-size: 12px;
        opacity: 0.7;
        margin-top: 6px;
        max-width: 280px;
        line-height: 1.6;
    }

    .preview-active {
        display: none;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
    }
    .preview-active.show { display: flex; }

    .detail-header {
        padding: 12px 16px;
        background: #F1F5F9;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
    }
    .detail-header .title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .detail-header .section-tag {
        font-size: 11px;
        color: var(--primary-dark);
        background: #E0E7FF;
        padding: 2px 8px;
        border-radius: 20px;
        font-weight: 600;
        font-family: var(--mono);
    }

    .detail-body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .field-block {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        position: relative;
    }
    .field-block .field-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .field-block .field-value {
        font-size: 14px;
        color: var(--text);
        word-break: break-all;
        line-height: 1.6;
        padding-right: 36px;
    }
    .field-block .field-value.mono {
        font-family: var(--mono);
        font-size: 13px;
    }
    .field-block .copy-icon-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 15px;
        padding: 4px;
        border-radius: 6px;
        transition: var(--transition);
        line-height: 1;
    }
    .field-block .copy-icon-btn:hover {
        background: var(--bg);
        color: var(--primary);
    }

    .related-block {
        background: #FFFBEB;
        border: 1px solid #FDE68A;
        border-radius: var(--radius-sm);
        padding: 12px 14px;
    }
    .related-block .field-label {
        color: #92400E;
    }
    .related-item {
        font-size: 12px;
        font-family: var(--mono);
        color: var(--text);
        padding: 4px 0;
        border-bottom: 1px dashed #FDE68A;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .related-item:last-child { border-bottom: none; }
    .related-item .rel-section {
        font-size: 10px;
        color: #92400E;
        background: #FEF3C7;
        padding: 1px 6px;
        border-radius: 10px;
        font-weight: 600;
        flex-shrink: 0;
    }

    /* ===== Toast ===== */
    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: #1E293B;
        color: #F1F5F9;
        padding: 8px 22px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 500;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
        z-index: 999;
        white-space: nowrap;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 900px) {
        .main-layout { flex-direction: column; }
        .left-panel { flex: none; }
        .right-panel { min-height: 200px; }
    }
    @media (max-width: 600px) {
        .app { padding: 12px; }
        .header h1 { font-size: 18px; }
        .header h1 span { font-size: 12px; padding: 1px 10px; }
        .list-item { padding: 6px 8px; flex-wrap: wrap; }
        .list-item .content .primary { font-size: 12px; }
        .list-item .content .secondary { font-size: 11px; }
    }
</style>
</head>
<body>

<div class="app">
    <!-- 头部 -->
    <div class="header" id="appHeader">
        <div class="header-left">
            <h1>
                🔍 中文-id 查找器
                <span>双向查询</span>
            </h1>
            <p>加载语言文件 → 输入中文查 ID，或输入 ID 查中文，实时动态显示</p>
        </div>
        <button class="hide-desc-btn" id="hideDescBtn" title="折叠/展开介绍">收起介绍</button>
    </div>

    <!-- 主布局 -->
    <div class="main-layout">

        <!-- ===== 左栏 ===== -->
        <div class="left-panel">
            <!-- 文件上传区 -->
            <div class="input-section">
                <label>📂 加载语言文件（JSON）</label>
                <div class="file-drop-zone" id="dropZone">
                    <input type="file" id="langFile" accept=".json,application/json" hidden>
                    <span class="big-icon">📄</span>
                    <div class="main-text" id="dropMainText">点击选择或拖拽 JSON 文件到此处</div>
                    <div class="sub" id="fileStatus">未加载</div>
                </div>
            </div>

            <!-- 搜索结果区 -->
            <div class="result-section">
                <div class="search-bar">
                    <div class="search-wrap">
                        <span class="icon">🔎</span>
                        <input type="text" id="searchInput" placeholder="输入中文或 ID..." autofocus />
                        <button class="clear-btn" id="clearSearchBtn" title="清空" style="display:none;">✕</button>
                    </div>
                    <span class="mode-badge idle" id="modeBadge">自动识别</span>
                    <label class="toggle-dsc" id="toggleDsc" title="屏蔽所有以 dsc 结尾的描述性键">
                        <input type="checkbox" id="hideDscCheck" checked />
                        <span>屏蔽 dsc</span>
                        <span class="dsc-count" id="dscCount">0</span>
                    </label>
                    <span class="stats">匹配 <strong id="matchCount">0</strong> / <span id="totalCount">0</span></span>
                </div>
                <div class="list-container" id="listContainer">
                    <div class="empty-state">
                        <span class="big-icon">⌨️</span>
                        请先加载语言文件
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== 右栏：详情 ===== -->
        <div class="right-panel">
            <div class="preview-placeholder" id="previewPlaceholder">
                <span class="big-icon">💡</span>
                <div>点击左侧条目查看详情</div>
                <div class="sub">将显示完整的 ID、中文值、所属分类，以及同值的所有键（用于排查歧义）</div>
            </div>
            <div class="preview-active" id="previewActive">
                <!-- 由 JS 动态填充 -->
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
    'use strict';

    // ============================================================
    //  状态
    // ============================================================
    let entries = [];          // [{ section, key, value, isDsc }, ...] 全量条目
    let valueToKeys = null;     // Map: 中文值 -> [{section, key}, ...]  (用于反查歧义)
    let currentResults = [];    // 当前匹配结果
    let activeIndex = -1;       // 当前选中的列表项
    let toastTimer = null;
    let hideDsc = true;         // 是否屏蔽 dsc 键（默认开启）

    // ============================================================
    //  DOM 引用
    // ============================================================
    const $ = id => document.getElementById(id);
    const langFileInput = $('langFile');
    const dropZone = $('dropZone');
    const dropMainText = $('dropMainText');
    const fileStatus = $('fileStatus');
    const searchInput = $('searchInput');
    const clearSearchBtn = $('clearSearchBtn');
    const modeBadge = $('modeBadge');
    const matchCount = $('matchCount');
    const totalCount = $('totalCount');
    const listContainer = $('listContainer');
    const previewPlaceholder = $('previewPlaceholder');
    const previewActive = $('previewActive');
    const toast = $('toast');
    const hideDescBtn = $('hideDescBtn');
    const appHeader = $('appHeader');
    const hideDscCheck = $('hideDscCheck');
    const dscCountEl = $('dscCount');

    // ============================================================
    //  工具函数
    // ============================================================
    function showToast(msg, duration) {
        duration = duration || 1600;
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
            toastTimer = null;
        }, duration);
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function escapeRegex(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlight(text, query) {
        if (!query || !text) return escapeHtml(text);
        const q = escapeRegex(query);
        const regex = new RegExp('(' + q + ')', 'gi');
        return escapeHtml(text).replace(regex, '<mark>$1</mark>');
    }

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
            showToast('✅ 已复制: ' + (text.length > 30 ? text.slice(0, 30) + '...' : text));
        } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ 已复制');
        }
    }

    // ============================================================
    //  检测输入方向：含 CJK 字符 → 中文查 ID；纯 ASCII → ID 查中文
    // ============================================================
    function detectMode(query) {
        // CJK 统一汉字 + 扩展区 A/B + 兼容汉字
        if (/[\u3400-\u9FFF\uF900-\uFAFF]/.test(query)) {
            return 'zh';   // 输入中文，查 ID
        }
        return 'id';       // 输入 ID，查中文
    }

    // ============================================================
    //  加载语言文件
    // ============================================================
    function handleFile(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.json')) {
            showToast('⚠️ 请选择 JSON 文件');
            return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                buildIndex(data);
                dropZone.classList.add('loaded');
                dropMainText.textContent = '✅ 已加载，可重新选择替换';
                const visibleCount = getVisibleEntries().length;
                const dscNum = parseInt(dscCountEl.textContent, 10) || 0;
                fileStatus.textContent = `${file.name} · ${entries.length} 条（屏蔽 ${dscNum} dsc，可见 ${visibleCount}）· ${valueToKeys.size} 唯一值`;
                showToast(`✅ 已加载 ${entries.length} 条记录（屏蔽 ${dscNum} 个 dsc 键）`);
                // 触发一次搜索（如果有内容）
                if (searchInput.value) doSearch();
                else renderEmpty('⌨️', '在上方输入中文或 ID 开始查找');
                searchInput.focus();
            } catch (err) {
                showToast('⚠️ JSON 解析失败: ' + err.message);
                fileStatus.textContent = '解析失败';
            }
        };
        reader.onerror = () => showToast('⚠️ 文件读取失败');
        reader.readAsText(file, 'utf-8');
    }

    function buildIndex(data) {
        entries = [];
        valueToKeys = new Map();
        let dscCount = 0;
        for (const [section, content] of Object.entries(data)) {
            if (content && typeof content === 'object' && !Array.isArray(content)) {
                for (const [key, value] of Object.entries(content)) {
                    if (typeof value === 'string') {
                        // 标记是否为 dsc 描述性键（以 dsc 结尾，大小写不敏感）
                        const isDsc = /dsc$/i.test(key);
                        if (isDsc) dscCount++;
                        entries.push({ section, key, value, isDsc });
                        if (value.length > 0) {
                            if (!valueToKeys.has(value)) valueToKeys.set(value, []);
                            valueToKeys.get(value).push({ section, key });
                        }
                    }
                }
            }
        }
        // 更新总数显示（根据当前屏蔽状态）
        updateTotalCount();
        // 更新 dsc 计数徽标
        dscCountEl.textContent = dscCount;
    }

    // 根据当前屏蔽状态计算可见条目总数
    function getVisibleEntries() {
        return hideDsc ? entries.filter(e => !e.isDsc) : entries;
    }

    function updateTotalCount() {
        const visible = getVisibleEntries();
        totalCount.textContent = visible.length;
    }

    // ============================================================
    //  搜索核心
    // ============================================================
    function doSearch() {
        if (entries.length === 0) {
            renderEmpty('📄', '请先加载语言文件');
            return;
        }
        const query = searchInput.value.trim();
        // 清空按钮显示控制
        clearSearchBtn.style.display = query ? 'block' : 'none';

        if (!query) {
            modeBadge.className = 'mode-badge idle';
            modeBadge.textContent = '自动识别';
            matchCount.textContent = '0';
            renderEmpty('⌨️', '在上方输入中文或 ID 开始查找');
            hideDetail();
            return;
        }

        const mode = detectMode(query);
        const qLower = query.toLowerCase();
        // 基于可见条目（根据 dsc 屏蔽状态过滤）进行搜索
        const pool = getVisibleEntries();

        if (mode === 'zh') {
            // 中文 → 查 ID：在 value 中搜索
            modeBadge.className = 'mode-badge zh';
            modeBadge.textContent = '中文 → ID';
            currentResults = pool
                .filter(e => e.value && e.value.toLowerCase().includes(qLower))
                .map(e => ({
                    section: e.section,
                    key: e.key,
                    value: e.value,
                    matchText: e.value,      // 高亮中文
                    displayKey: e.key         // 对应的 ID
                }));
        } else {
            // ID → 查中文：在 key 中搜索
            modeBadge.className = 'mode-badge id';
            modeBadge.textContent = 'ID → 中文';
            currentResults = pool
                .filter(e => e.key.toLowerCase().includes(qLower))
                .map(e => ({
                    section: e.section,
                    key: e.key,
                    value: e.value,
                    matchText: e.key,         // 高亮 ID
                    displayValue: e.value     // 对应的中文
                }));
        }

        // 限制结果数量，避免渲染过多卡顿
        const MAX = 500;
        const truncated = currentResults.length > MAX;
        const display = truncated ? currentResults.slice(0, MAX) : currentResults;

        matchCount.textContent = currentResults.length;
        renderList(display, query, mode, truncated);
        hideDetail();
    }

    // ============================================================
    //  渲染列表
    // ============================================================
    function renderEmpty(icon, msg) {
        listContainer.innerHTML =
            '<div class="empty-state"><span class="big-icon">' + icon + '</span>' + msg + '</div>';
    }

    function renderList(list, query, mode, truncated) {
        if (list.length === 0) {
            renderEmpty('🔍', '没有匹配的项');
            return;
        }

        let html = '';
        for (let i = 0; i < list.length; i++) {
            const item = list[i];
            const idx = i + 1;
            if (mode === 'zh') {
                // 中文 → ID：左侧高亮中文，右侧显示 ID
                html +=
                    '<div class="list-item" data-idx="' + i + '">' +
                    '<span class="idx">#' + idx + '</span>' +
                    '<span class="section-tag">' + escapeHtml(item.section) + '</span>' +
                    '<div class="content">' +
                    '<span class="primary" style="font-family:var(--font);">' + highlight(item.value, query) + '</span>' +
                    '<span class="secondary" style="font-family:var(--mono);">id=' + escapeHtml(item.key) + '</span>' +
                    '</div>' +
                    '<span class="arrow">→</span>' +
                    '<button class="copy-btn" data-copy="' + escapeHtml(item.key) + '" title="复制 ID">📋</button>' +
                    '</div>';
            } else {
                // ID → 中文：左侧高亮 ID，右侧显示中文
                html +=
                    '<div class="list-item" data-idx="' + i + '">' +
                    '<span class="idx">#' + idx + '</span>' +
                    '<span class="section-tag">' + escapeHtml(item.section) + '</span>' +
                    '<div class="content">' +
                    '<span class="primary">' + highlight(item.key, query) + '</span>' +
                    '<span class="secondary">' + escapeHtml(item.value || '(空)') + '</span>' +
                    '</div>' +
                    '<span class="arrow">→</span>' +
                    '<button class="copy-btn" data-copy="' + escapeHtml(item.value) + '" title="复制中文">📋</button>' +
                    '</div>';
            }
        }
        if (truncated) {
            html += '<div class="empty-state" style="padding:10px;">⚠️ 结果过多，仅显示前 500 项，请输入更精确的关键词</div>';
        }
        listContainer.innerHTML = html;
    }

    // ============================================================
    //  详情视图
    // ============================================================
    function showDetail(item) {
        const related = (valueToKeys.get(item.value) || []).filter(
            r => !(r.section === item.section && r.key === item.key)
        );

        let html =
            '<div class="detail-header">' +
            '<div class="title">条目详情 <span class="section-tag">' + escapeHtml(item.section) + '</span></div>' +
            '</div>' +
            '<div class="detail-body">' +
            '<div class="field-block">' +
            '<div class="field-label">🔑 ID（键）</div>' +
            '<div class="field-value mono">' + escapeHtml(item.key) + '</div>' +
            '<button class="copy-icon-btn" data-copy="' + escapeHtml(item.key) + '" title="复制 ID">📋</button>' +
            '</div>' +
            '<div class="field-block">' +
            '<div class="field-label">📝 中文名（值）</div>' +
            '<div class="field-value">' + escapeHtml(item.value || '(空字符串)') + '</div>' +
            '<button class="copy-icon-btn" data-copy="' + escapeHtml(item.value) + '" title="复制中文">📋</button>' +
            '</div>' +
            '<div class="field-block">' +
            '<div class="field-label">📁 所属分类</div>' +
            '<div class="field-value mono">' + escapeHtml(item.section) + '</div>' +
            '</div>';

        if (related.length > 0) {
            html += '<div class="related-block">' +
                '<div class="field-label">⚠️ 同值的其他键（共 ' + related.length + ' 个，存在歧义）</div>';
            for (const r of related) {
                html += '<div class="related-item">' +
                    '<span class="rel-section">' + escapeHtml(r.section) + '</span>' +
                    '<span>' + escapeHtml(r.key) + '</span>' +
                    '</div>';
            }
            html += '</div>';
        }

        html += '</div>';

        previewActive.innerHTML = html;
        previewPlaceholder.style.display = 'none';
        previewActive.classList.add('show');

        // 绑定复制按钮
        previewActive.querySelectorAll('.copy-icon-btn').forEach(btn => {
            btn.addEventListener('click', () => copyText(btn.getAttribute('data-copy')));
        });
    }

    function hideDetail() {
        previewActive.classList.remove('show');
        previewPlaceholder.style.display = 'flex';
        previewActive.innerHTML = '';
        activeIndex = -1;
        // 清除列表高亮
        listContainer.querySelectorAll('.list-item.active').forEach(el => el.classList.remove('active'));
    }

    // ============================================================
    //  事件绑定
    // ============================================================

    // 文件上传：点击
    dropZone.addEventListener('click', () => langFileInput.click());
    langFileInput.addEventListener('change', e => {
        if (e.target.files[0]) handleFile(e.target.files[0]);
        e.target.value = '';  // 允许重复选择同一文件
    });

    // 文件上传：拖拽
    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    });

    // 隐藏/展开介绍
    hideDescBtn.addEventListener('click', () => {
        appHeader.classList.toggle('collapsed');
        const collapsed = appHeader.classList.contains('collapsed');
        hideDescBtn.textContent = collapsed ? '展开介绍' : '收起介绍';
    });

    // 屏蔽 dsc 开关
    hideDscCheck.addEventListener('change', () => {
        hideDsc = hideDscCheck.checked;
        updateTotalCount();
        doSearch();  // 立即重新搜索
        showToast(hideDsc ? '已屏蔽 dsc 描述键' : '已显示全部键');
    });

    // 搜索：实时输入（防抖）
    let searchTimer = null;
    searchInput.addEventListener('input', () => {
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(doSearch, 120);
    });

    // 清空搜索
    clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        doSearch();
        searchInput.focus();
    });

    // 列表点击：显示详情
    listContainer.addEventListener('click', e => {
        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn) {
            e.stopPropagation();
            copyText(copyBtn.getAttribute('data-copy'));
            return;
        }
        const item = e.target.closest('.list-item');
        if (!item) return;
        const idx = parseInt(item.getAttribute('data-idx'), 10);
        if (isNaN(idx) || !currentResults[idx]) return;

        // 高亮选中
        listContainer.querySelectorAll('.list-item.active').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        activeIndex = idx;

        showDetail(currentResults[idx]);
    });

    // 键盘导航：上下选择，Enter 查看详情，Esc 清空
    searchInput.addEventListener('keydown', e => {
        const items = listContainer.querySelectorAll('.list-item');
        if (items.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, items.length - 1);
            items[activeIndex].scrollIntoView({ block: 'nearest' });
            items[activeIndex].click();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, 0);
            items[activeIndex].scrollIntoView({ block: 'nearest' });
            items[activeIndex].click();
        } else if (e.key === 'Escape') {
            searchInput.value = '';
            clearSearchBtn.style.display = 'none';
            doSearch();
        }
    });

})();
</script>

</body>
</html>
