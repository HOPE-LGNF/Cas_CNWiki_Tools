<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小工具集合 | Tools Collection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-sub: #8b949e;
            --accent: #58a6ff;
        }

        body {
            font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header { text-align: center; margin-bottom: 40px; }

        header h1 { font-size: 2rem; margin-bottom: 8px; }
        header h1 span { color: var(--accent); }
        header p { color: var(--text-sub); }

        .toolbar {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .toolbar input {
            width: 100%;
            max-width: 400px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }

        .toolbar input:focus { border-color: var(--accent); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all .25s ease;
            text-decoration: none;
            color: var(--text);
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(88, 166, 255, .15);
        }

        .card .icon {
            font-size: 28px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(88, 166, 255, .1);
            border-radius: 10px;
        }

        .card .title { font-size: 16px; font-weight: 600; }

        .card .desc {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            flex: 1;
        }

        .card .file {
            font-size: 12px;
            color: var(--accent);
            font-family: Consolas, monospace;
        }

        .status {
            text-align: center;
            color: var(--text-sub);
            padding: 40px 0;
            font-size: 14px;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-sub);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧰 小工具<span>集合</span></h1>
            <p>基于纯 HTML / JS / CSS 的实用小工具</p>
        </header>

        <div class="toolbar">
            <input type="text" id="search" placeholder="🔍 搜索工具名称...">
        </div>

        <div id="status" class="status">正在加载工具列表...</div>
        <div id="grid" class="grid"></div>

        <footer>Powered by GitHub Pages</footer>
    </div>

    <script>
        const SRC_DIR = "src";   // 工具所在目录
        const JSON_URL = "tools.json";

        let allTools = [];

        async function loadTools() {
            const grid = document.getElementById("grid");
            const status = document.getElementById("status");

            try {
                const res = await fetch(JSON_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allTools = await res.json();
            } catch (e) {
                status.textContent = `❌ 加载 tools.json 失败：${e.message}`;
                return;
            }

            if (allTools.length === 0) {
                status.textContent = "tools.json 中没有工具";
                return;
            }

            status.style.display = "none";
            render(allTools);
        }

        function render(tools) {
            document.getElementById("grid").innerHTML = tools.map(t => `
                <a class="card" href="${SRC_DIR}/${t.file}" target="_blank">
                    <div class="icon">${t.icon || "⚙️"}</div>
                    <div class="title">${t.title}</div>
                    <div class="desc">${t.desc || ""}</div>
                    <div class="file">src/${t.file}</div>
                </a>`).join("");
        }

        // 搜索过滤
        document.getElementById("search").addEventListener("input", e => {
            const kw = e.target.value.toLowerCase();
            const filtered = allTools.filter(t =>
                t.title.toLowerCase().includes(kw) ||
                t.file.toLowerCase().includes(kw) ||
                (t.desc || "").toLowerCase().includes(kw)
            );
            if (filtered.length === 0) {
                document.getElementById("status").style.display = "block";
                document.getElementById("status").textContent = "没有匹配的工具";
                document.getElementById("grid").innerHTML = "";
            } else {
                document.getElementById("status").style.display = "none";
                render(filtered);
            }
        });

        loadTools();
    </script>
</body>
</html>
